name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Docs links, interaction model, environment variables
        run: python scripts/check_repo.py

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  docker:
    name: Docker image and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid (every profile)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile caddy --profile searxng config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -e PUBLIC_HOST=alexa.example.com -e UPSTREAM=alexa-ai-bridge:8090 \
            -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build image
        run: docker build -t alexa-ai-bridge:ci .
      - name: Smoke test
        run: |
          docker run -d --name bridge -p 127.0.0.1:8090:8090 \
            -e SKILL_ID=amzn1.ask.skill.ci -e LLM_BASE_URL=http://127.0.0.1:9/v1 -e LLM_MODEL=ci alexa-ai-bridge:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:8090/health)" = '{"ok":true}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:8090/alexa)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'not json' http://127.0.0.1:8090/alexa)" = 400
          docker exec bridge python -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Rome')"
          test "$(docker inspect -f '{{.Config.User}}' bridge)" = app
      - name: Container log
        if: always()
        run: docker logs bridge || true
