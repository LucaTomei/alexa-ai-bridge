name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # the release workflow runs every check before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Docs links, interaction model, environment variables
        run: python scripts/check_repo.py
      - name: Admin page JavaScript parses
        run: node --check src/admin/app.js

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Tests with coverage (fails under 95%)
        env:
          REQUIRE_BROWSER: "1"      # the admin page is also tested in headless Chrome, preinstalled on the runner
        run: python -m pytest -q --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=95

  docker:
    name: Docker image and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid (every profile)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile caddy --profile searxng config -q
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build image
        run: docker build -t alexa-ai-bridge:ci .
      - name: Smoke test
        run: |
          docker run -d --name bridge -p 127.0.0.1:8090:8090 \
            -e SKILL_ID=amzn1.ask.skill.ci -e LLM_BASE_URL=http://127.0.0.1:9/v1 -e LLM_MODEL=ci alexa-ai-bridge:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:8090/health)" = '{"ok":true}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:8090/alexa)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'not json' http://127.0.0.1:8090/alexa)" = 400
          docker exec bridge python -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Rome')"
          test "$(docker inspect -f '{{.Config.User}}' bridge)" = app
      - name: Admin page through Caddy is published only with ADMIN_PUBLIC=on, on both sides
        run: |
          docker network create prova
          ci_env="-e SKILL_ID=amzn1.ask.skill.ci -e LLM_BASE_URL=http://127.0.0.1:9/v1 -e LLM_MODEL=ci -e ADMIN_PASSWORD=ci-admin-password"
          docker run -d --name ponte-on --network prova $ci_env -e ADMIN_PUBLIC=on alexa-ai-bridge:ci
          docker run -d --name ponte-off --network prova $ci_env alexa-ai-bridge:ci
          avvia() {   # name, ADMIN_PUBLIC for Caddy, upstream, host port
            docker run -d --name "$1" --network prova -p "127.0.0.1:$4:80" -e PUBLIC_HOST=:80 -e UPSTREAM="$3:8090" \
              -e ADMIN_PUBLIC="$2" -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2
          }
          avvia caddy-on on ponte-on 18081
          avvia caddy-off off ponte-on 18082
          avvia caddy-vuoto "" ponte-on 18083
          avvia caddy-strano true ponte-on 18084
          avvia caddy-on-ponte-off on ponte-off 18085
          sleep 8
          codice() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$1$2"; }
          for p in 18081 18082 18083 18084 18085; do test "$(codice $p /health)" = 200; done   # Alexa endpoint always up
          test "$(codice 18081 /admin)" = 200          # published on both sides
          test "$(codice 18082 /admin)" = 404          # Caddy hides it
          test "$(codice 18082 /admin/api/sessione)" = 404
          test "$(codice 18082 /ADMIN)" = 404
          test "$(codice 18082 //admin)" = 404
          test "$(codice 18083 /admin)" = 404          # empty value: hidden
          test "$(codice 18084 /admin)" = 404          # unexpected value: hidden, and Caddy still runs
          test "$(codice 18085 /admin)" = 404          # Caddy publishes it, the bridge refuses proxied requests
      - name: Container log
        if: always()
        run: |
          docker logs bridge || true
          for c in caddy-on caddy-off caddy-strano ponte-off; do echo "== $c"; docker logs "$c" 2>&1 | tail -5 || true; done
      - name: docker compose up, as in the setup guide, with the code of this commit
        run: |
          docker rm -f bridge
          docker compose up -d --build --wait --wait-timeout 180
          test "$(curl -s http://127.0.0.1:8090/health)" = '{"ok":true}'
          docker compose logs alexa-ai-bridge
          ! docker compose logs alexa-ai-bridge | grep -i traceback
          docker compose down

  release-dry-run:
    name: Multi-arch image build (as on release, without publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
