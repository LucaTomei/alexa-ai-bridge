name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # the release workflow runs every check before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Docs links, interaction model, environment variables
        run: python scripts/check_repo.py
      - name: Admin page JavaScript parses
        run: node --check src/admin/app.js

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Tests with coverage (fails under 95%)
        env:
          REQUIRE_BROWSER: "1"      # the admin page is also tested in headless Chrome, preinstalled on the runner
        run: python -m pytest -q --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=95

  docker:
    name: Docker image and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid (every profile)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile caddy --profile searxng config -q
      - name: Caddyfile is valid, and /admin is published only with ADMIN_PUBLIC=on
        run: |
          for admin in off on; do
            docker run --rm -e PUBLIC_HOST=alexa.example.com -e UPSTREAM=alexa-ai-bridge:8090 -e ADMIN_PUBLIC=$admin \
              -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2 \
              caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > caddy-$admin.json
          done
          grep -q '"/admin\*"' caddy-off.json && ! grep -q '"/admin\*"' caddy-on.json
          docker run --rm -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build image
        run: docker build -t alexa-ai-bridge:ci .
      - name: Smoke test
        run: |
          docker run -d --name bridge -p 127.0.0.1:8090:8090 \
            -e SKILL_ID=amzn1.ask.skill.ci -e LLM_BASE_URL=http://127.0.0.1:9/v1 -e LLM_MODEL=ci alexa-ai-bridge:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:8090/health)" = '{"ok":true}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:8090/alexa)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'not json' http://127.0.0.1:8090/alexa)" = 400
          docker exec bridge python -c "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Rome')"
          test "$(docker inspect -f '{{.Config.User}}' bridge)" = app
      - name: Container log
        if: always()
        run: docker logs bridge || true
      - name: docker compose up, as in the setup guide (pulls the release image, or builds it before the first release)
        run: |
          docker rm -f bridge
          docker compose up -d --wait --wait-timeout 180
          test "$(curl -s http://127.0.0.1:8090/health)" = '{"ok":true}'
          docker compose logs alexa-ai-bridge
          ! docker compose logs alexa-ai-bridge | grep -i traceback
          docker compose down

  release-dry-run:
    name: Multi-arch image build (as on release, without publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
