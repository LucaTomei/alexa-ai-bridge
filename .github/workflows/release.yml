name: Release

# Push a tag like v1.2.3: every CI check runs, then a multi-arch image (amd64 + arm64) is published to
# ghcr.io/<owner>/alexa-ai-bridge with the tags 1.2.3, 1.2, 1 and latest, and a GitHub release is created.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish the Docker image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name (lowercase, as the registry requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=alexa-ai-bridge
            org.opencontainers.image.description=Talk to any AI model from your Echo: conversations, web search and safe Home Assistant control
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image
        run: |
          docker run -d --name bridge -p 127.0.0.1:8090:8090 \
            -e SKILL_ID=amzn1.ask.skill.ci -e LLM_BASE_URL=http://127.0.0.1:9/v1 -e LLM_MODEL=ci "$IMAGE:${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/health && break; sleep 1; done
          test "$(curl -s http://127.0.0.1:8090/health)" = '{"ok":true}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:8090/alexa)" = 400

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          ## Docker image

          \`\`\`bash
          docker pull $IMAGE:$VERSION
          \`\`\`

          Tags: \`$VERSION\`, \`${VERSION%.*}\`, \`${VERSION%%.*}\` and \`latest\` (amd64 and arm64).
          To update an existing installation: \`docker compose pull && docker compose up -d\`.
          See [docs/setup.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/setup.md#updating).
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
