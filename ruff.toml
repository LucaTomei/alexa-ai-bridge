line-length = 160
target-version = "py311"

[lint]
# Real bugs only (syntax errors, undefined names, unused code, common pitfalls); the compact style is intentional.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E401", "E702", "E731", "E741", "B008"]

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
